name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        # 跟随 latest stable；Windows 本地开发要求 >= 1.4.0（socket 继承 bug，见 AGENTS.md）

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bun run build
