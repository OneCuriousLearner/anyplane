name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2
        # 跟随 latest stable；Windows 本地开发要求 >= 1.4.0（socket 继承 bug，见 AGENTS.md）

      - run: bun install --frozen-lockfile

      - run: bun run typecheck

      # Biome（lint only，无 formatter）：依赖红线 noRestrictedImports + bug 类规则
      - run: bun run lint

      - run: bun test

      # mock CLI 全链路 e2e（唯一不依赖真实 claude/codex 的 e2e：审批/补发//clear 重键）
      - run: bun run server/scripts/e2e-mock.ts

      - run: bun run build

  docker:
    name: docker build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      # 只构建不推送：验证 Dockerfile 可构建 + 双 CLI 在镜像内可执行（RUN 行有版本断言）
      - run: docker build -t anyplane:ci .
