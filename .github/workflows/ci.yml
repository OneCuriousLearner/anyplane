name: CI

on:
  push:
    branches: [master]
  pull_request:

jobs:
  test:
    name: test & build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          # Windows 需要 >= 1.3.15（socket 继承 bug，见 AGENTS.md）；CI 统一钉住
          bun-version: "1.3.15"

      - run: bun install --frozen-lockfile

      - run: bun test

      - run: bun run build
