name: app-ios-spike

on:
  workflow_dispatch:
  push:
    paths:
      - 'app/ios/ci/**'
      - 'web/src/lib/nativeBridge.ts'
      - '.github/workflows/app-ios-spike.yml'

jobs:
  spike:
    name: iOS simulator 通知 action spike
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # 业务前端（桩服务器静态托管它；server.url 指回桩）
      - run: bun run build

      # CI 构建注入 server.url：跳过引导页直连桩（仅本工作流的临时改动，不入库）
      - name: Inject server.url for spike
        working-directory: app
        run: |
          ruby -e '
            c = File.read("capacitor.config.ts")
            c.sub!("webDir: '"'"'www'"'"',", "webDir: '"'"'www'"'"',\n  server: { url: '"'"'http://127.0.0.1:7480/?testNotify=1'"'"' },") or abort("inject failed")
            File.write("capacitor.config.ts", c)
          '
          bunx cap sync ios

      # 桩服务器：静态托管 dist + 记录裁决 POST
      - name: Start stub server
        run: |
          rm -f /tmp/resolve.log
          nohup bun app/ios/ci/stub-server.ts web/dist > /tmp/stub.log 2>&1 &
          sleep 2
          curl -s -o /dev/null -w '%{http_code}\n' http://127.0.0.1:7480/

      # 编译（simulator 无签名）
      - name: Build app
        working-directory: app
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO build

      # 注入 UI 测试目标并运行
      - name: Add UI test target & run spike
        working-directory: app
        run: |
          gem install xcodeproj --no-document
          ruby ../app/ios/ci/add-ui-tests.rb
          xcodebuild test -project ios/App/App.xcodeproj -scheme App \
            -configuration Debug -sdk iphonesimulator \
            -destination 'platform=iOS Simulator,name=iPhone 17' \
            CODE_SIGNING_ALLOWED=NO \
            -resultBundlePath /tmp/spike.xcresult

      - name: Assert resolve POST arrived
        run: |
          echo '--- stub.log ---'; cat /tmp/stub.log || true
          echo '--- resolve.log ---'; cat /tmp/resolve.log || true
          grep -q 'ci-test-1' /tmp/resolve.log

      - name: Upload artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ios-spike
          path: |
            /tmp/resolve.log
            /tmp/stub.log
            /tmp/spike.xcresult
          if-no-files-found: ignore
