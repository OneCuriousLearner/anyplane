name: Complexity patrol

on:
  schedule:
    # 每周三 02:17 UTC 跑一次（与 protocol-drift 的周一错峰，同避开整点拥堵）
    - cron: '17 2 * * 3'
  workflow_dispatch:

# 与 protocol-drift.yml 同一套权限模型：GITHUB_TOKEN 默认只读，
# 开 issue 必须显式 issues:write；未列出的 scope 归 none，checkout 带 contents:read。
permissions:
  contents: read
  issues: write

jobs:
  complexity-report:
    name: 巨石/神组件定量探测
    runs-on: ubuntu-latest
    steps:
      # fetch-depth: 0 必需——churn 列来自 `git log --since='6 months ago'`，
      # 默认浅克隆只能看到 tip，churn 恒 0/1、热点排序失真
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      # 脚本 import typescript（devDependency），fresh checkout 必须先装依赖
      - run: bun install --frozen-lockfile

      # 脚本纯无状态：exit 1 仅表示"本次扫描有命中"（当期事实），
      # 是否存在*新增*告警由人/LLM 对照 docs/complexity-baseline.md 裁决。
      # pipefail 必需：没有它 bun 的退出码会被 tee 掩盖，if: failure() 永不触发。
      - name: complexity report
        run: |
          set -o pipefail
          bun scripts/complexity-report.ts | tee "$GITHUB_STEP_SUMMARY" report.md

      # 有命中 → 开 issue 递送报告全文。本步骤不做差集、不读基线文档：
      # 状态判定全部留给读 issue 的人/LLM（issue 按标题前缀去重，
      # 上期未处置关闭则本周不重复开）。
      - name: any hits → open issue
        if: failure()
        uses: actions/github-script@v8
        env:
          DRIFT_LABEL: complexity-patrol
          DRIFT_LABEL_COLOR: '7C3AED'
          DRIFT_LABEL_DESCRIPTION: 复杂度定量探测周报（巨石文件/神组件嫌疑）
          DRIFT_TITLE_PREFIX: 复杂度周报
        with:
          script: |
            const fs = require('fs')
            const report = fs.readFileSync('report.md', 'utf8')
            process.env.DRIFT_BODY = [
              '本周复杂度定量探测有文件命中阈值，报告全文见文末。',
              '',
              '处置流程（脚本与 CI 均无状态，BASELINE/NEW 判定由人/LLM 完成）：',
              '1. 先读 `docs/complexity-baseline.md`——现在时表中的文件是既有裁决，视为已知。',
              '2. 报告与已知集合的差集 = 本轮新增嫌疑；命中阈值 ≠ 必须拆（基线文档有 813 行不拆的反例）。',
              '3. 对每个新增嫌疑做定性裁决：确认巨石且有清晰边界 → 拆；大但内聚 → 入基线文档表。',
              '4. 或整轮委托：`bash scripts/claude-task.sh complexity-patrol`。',
              '5. 处置完毕关闭本 issue；下周仍有命中会开新一期。',
              '',
              '---',
              '',
              report,
            ].join('\n')
            const open = require(`${process.env.GITHUB_WORKSPACE}/.github/scripts/open-drift-issue.cjs`)
            await open({ github, context, core })
