<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="dark">
<title>AnyPlane</title>
<style>
  :root {
    --bg: #0a0a0b;
    --surface: rgba(255, 255, 255, 0.06);
    --border: rgba(255, 255, 255, 0.12);
    --text: rgba(255, 255, 255, 0.92);
    --text-dim: rgba(255, 255, 255, 0.55);
    --accent: #7c8aff;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font: 14px/1.6 -apple-system, "PingFang SC", "Noto Sans SC", system-ui, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
    padding-top: calc(24px + env(safe-area-inset-top));
    padding-bottom: calc(24px + env(safe-area-inset-bottom));
  }
  .card { width: 100%; max-width: 360px; }
  h1 { font-size: 20px; font-weight: 600; margin: 0 0 6px; }
  .sub { color: var(--text-dim); margin: 0 0 24px; }
  label { display: block; color: var(--text-dim); margin-bottom: 8px; }
  input {
    width: 100%;
    padding: 12px 14px;
    border-radius: 12px;
    border: 1px solid var(--border);
    background: var(--surface);
    color: var(--text);
    font-size: 16px; /* iOS 防止聚焦缩放 */
    outline: none;
  }
  input:focus { border-color: var(--accent); }
  button, .btn {
    display: block;
    width: 100%;
    margin-top: 16px;
    padding: 12px;
    border-radius: 999px;
    border: none;
    background: var(--text);
    color: var(--bg);
    font-size: 15px;
    font-weight: 600;
    text-align: center;
    text-decoration: none;
    cursor: pointer;
  }
  .ghost {
    background: transparent;
    color: var(--text-dim);
    border: 1px solid var(--border);
    font-weight: 400;
  }
  .err { color: #ff6b6b; min-height: 20px; margin: 10px 2px 0; }
  .hint { color: var(--text-dim); font-size: 12px; margin-top: 20px; }
  code { color: var(--text); }
</style>
</head>
<body>
<div class="card" id="app"></div>
<script>
(function () {
  var KEY = 'anyplane.serverUrl';
  var app = document.getElementById('app');

  // 冷启动通知 action 接力：进程被回收后点通知按钮，localNotificationActionPerformed
  // 只会投递到当前已加载页面（即本引导页）。远端 AnyPlane 页面与本页不同源
  // （localStorage 不共享），故转成 ?nativeAction= query 带过去，
  // 由 web/src/lib/nativeBridge.ts 启动时消费（载荷只有 key/requestId/actionId，无凭据）。
  var pendingAction = null;
  try {
    var LN = window.Capacitor && window.Capacitor.Plugins && window.Capacitor.Plugins.LocalNotifications;
    if (LN) {
      LN.addListener('localNotificationActionPerformed', function (ev) {
        var extra = ev.notification && ev.notification.extra;
        if (extra && typeof extra.key === 'string' && typeof extra.requestId === 'string') {
          pendingAction = { key: extra.key, requestId: extra.requestId, actionId: ev.actionId };
        }
      });
    }
  } catch (e) { /* 桥不可用时静默降级为普通跳转 */ }

  function normalize(raw) {
    var s = (raw || '').trim();
    if (!s) return null;
    if (!/^https?:\/\//i.test(s)) s = 'https://' + s;
    try {
      var u = new URL(s);
      if (u.protocol !== 'https:' && u.protocol !== 'http:') return null;
      // 只保留源（协议+主机+端口），丢弃路径/查询/哈希
      return u.origin;
    } catch (e) {
      return null;
    }
  }

  function targetUrl(origin) {
    var url = origin;
    if (pendingAction) {
      url = origin + '/?nativeAction=' + encodeURIComponent(JSON.stringify(pendingAction));
    }
    // 原生通知点正文：MainActivity 在引导页只挂 __anyplanePendingOpen（本地 hash
    // 随 location.replace 丢掉）。接到远端 #s=，由 App.tsx 启动时消费。
    var openKey = window.__anyplanePendingOpen;
    if (typeof openKey === 'string' && openKey) {
      url += '#s=' + encodeURIComponent(openKey);
    }
    return url;
  }

  function showForm(err) {
    app.innerHTML =
      '<h1>AnyPlane</h1>' +
      '<p class="sub">连接到你的 AnyPlane 服务端</p>' +
      '<form id="f">' +
      '<label for="u">服务器地址</label>' +
      '<input id="u" type="url" inputmode="url" autocapitalize="off" autocorrect="off" ' +
      'placeholder="https://your-host:7480" value="' + (localStorage.getItem(KEY) || '') + '">' +
      '<p class="err">' + (err || '') + '</p>' +
      '<button type="submit">连接</button>' +
      '</form>' +
      '<p class="hint">局域网地址（如 <code>http://192.168.x.x:7480</code>）或公网地址均可；' +
      '登录令牌在打开页面后输入。</p>';
    document.getElementById('f').addEventListener('submit', function (ev) {
      ev.preventDefault();
      var origin = normalize(document.getElementById('u').value);
      if (!origin) {
        showForm('地址无效，请输入 http(s) 地址');
        return;
      }
      localStorage.setItem(KEY, origin);
      go(origin);
    });
  }

  function go(origin) {
    // 先清掉 #reconfigure——否则 900ms 后的跳转守卫永远拦截，且「重新配置」链接
    // 因 hash 不再变化而失效（评审发现的死锁：重配后提交卡在「正在连接」）
    if (location.hash === '#reconfigure') {
      history.replaceState(null, '', location.pathname + location.search);
    }
    app.innerHTML =
      '<h1>正在连接</h1>' +
      '<p class="sub"><code>' + origin + '</code></p>' +
      '<a class="btn ghost" href="#reconfigure">重新配置</a>';
    // 留出可点「重新配置」的窗口；#reconfigure 由下方 hashchange 接住
    setTimeout(function () {
      if (location.hash !== '#reconfigure') location.replace(targetUrl(origin));
    }, 900);
  }

  window.addEventListener('hashchange', function () {
    if (location.hash === '#reconfigure') showForm();
  });

  var saved = localStorage.getItem(KEY);
  if (location.hash === '#reconfigure' || !saved) {
    showForm();
  } else {
    go(saved);
  }
})();
</script>
</body>
</html>
